name: backend-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build (skip tests, already passed above)
        run: chmod +x gradlew && ./gradlew build -x test
      - name: Stop existing app
        run: |
          pkill -f 'slotkey-0.0.1-SNAPSHOT.jar' || true
          sleep 3
      - name: Start app
        run: |
          nohup java -jar build/libs/slotkey-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 &
          disown
      - name: Health check
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
            if [ "$code" != "000" ]; then
              echo "server responded with $code"
              exit 0
            fi
            sleep 5
          done
          echo "server did not respond"
          exit 1