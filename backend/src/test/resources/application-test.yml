spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    username: ""
    password: ""
custom:
  jwt:
    secret-key: slotkey-test-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
    expire-millis: 300000

app:
  pg:
    toss:
      secret-key: test-gsk-dummy-never-call-external-api

  space-image:
    storage-root: build/tmp/space-images
  verification:
    # 테스트 전용 공개값. 로컬·운영 비밀키로 사용하지 않는다.
    hash-secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    mail-from: ""

slotkey:
  scheduler:
    charge-recovery:
      enabled: false
    space-ranking:
      enabled: false
