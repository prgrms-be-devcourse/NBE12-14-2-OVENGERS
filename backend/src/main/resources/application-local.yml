spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/slotkey?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root

app:
  auth:
    cookie:
      secure: false
      same-site: Lax
  space-image:
    storage-root: ./data/space-images
  pg:
    toss:
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}

slotkey:
  scheduler:
    charge-recovery:
      enabled: true
