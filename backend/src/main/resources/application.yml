server:
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: slotkey
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

custom:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expire-millis: 300000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie:
      secure: true
      same-site: Lax

  credit:
    signup-grant: 50000

  # 공간 대표 이미지 영구 저장 경로
  # - spring.servlet.multipart.location 은 업로드 처리 중 임시 파싱 디렉터리입니다.
  # - app.space-image.storage-root 는 영구 보관용 디렉터리이며 배포 환경에서는 재시작 후에도 유지되는 지속 디스크여야 합니다.
  space-image:
    storage-root: ${SPACE_IMAGE_STORAGE_ROOT:./data/space-images}