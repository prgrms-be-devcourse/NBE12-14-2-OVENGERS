server:
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: slotkey
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        # 값은 slotkey.kafka 한 곳에서만 정의한다(불변식: send-timeout > delivery-timeout > request-timeout)
        "[max.block.ms]": ${slotkey.kafka.max-block-ms}
        "[request.timeout.ms]": ${slotkey.kafka.request-timeout-ms}
        "[delivery.timeout.ms]": ${slotkey.kafka.delivery-timeout-ms}

custom:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expire-millis: 300000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie:
      secure: true
      same-site: Lax
  verification:
    hash-secret: ${VERIFICATION_HASH_SECRET}
    mail-from: ${VERIFICATION_MAIL_FROM}
  credit:
    signup-grant: 50000

  pg:
    toss:
      base-url: https://api.tosspayments.com
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      connect-timeout: 3s
      read-timeout: 60s

  # 공간 대표 이미지 영구 저장 경로
  # - spring.servlet.multipart.location 은 업로드 처리 중 임시 파싱 디렉터리입니다.
  # - app.space-image.storage-root 는 영구 보관용 디렉터리이며 배포 환경에서는 재시작 후에도 유지되는 지속 디스크여야 합니다.
  space-image:
    storage-root: ${SPACE_IMAGE_STORAGE_ROOT:./data/space-images}

slotkey:
  kafka:
    enabled: ${SLOTKEY_KAFKA_ENABLED:false}
    send-timeout-ms: 6000
    delivery-timeout-ms: 5000
    request-timeout-ms: 3000
    max-block-ms: 3000
  outbox:
    relay:
      batch-size: 50
      fixed-delay-ms: 1000
  scheduler:
    charge-recovery:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
      batch-size: 50
